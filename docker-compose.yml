services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    container_name: ulpf-clickhouse
    environment:
      CLICKHOUSE_DB: ulpf
      CLICKHOUSE_USER: ulpf
      CLICKHOUSE_PASSWORD: ${ULPF_CLICKHOUSE_PASSWORD:-ulpf-local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}" --password
          "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  ulpf-engine:
    build: .
    image: ulpf-engine:latest
    container_name: ulpf-engine
    ports:
      - "8080:8080"
    environment:
      ULPF_CLICKHOUSE_URL: http://ulpf:${ULPF_CLICKHOUSE_PASSWORD:-ulpf-local}@clickhouse:8123/ulpf
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      # Mount source_packs read-write in dev so new/edited packs are picked
      # up via POST /packs/reload without rebuilding the image.
      - ./source_packs:/app/source_packs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ulpf-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ulpf-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.20.0
      ULPF_CLICKHOUSE_PASSWORD: ${ULPF_CLICKHOUSE_PASSWORD:-ulpf-local}
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  clickhouse-data:
  grafana-data:
