x-ulpf-service: &ulpf-service
  build: .
  image: ulpf-engine:0.1.0
  restart: unless-stopped
  environment: &ulpf-environment
    ULPF_KAFKA_BROKERS: redpanda:9092
    ULPF_SOURCE_PACKS_DIR: /app/source_packs
    ULPF_CLICKHOUSE_URL: http://ulpf:${ULPF_CLICKHOUSE_PASSWORD:-ulpf-local}@clickhouse:8123/ulpf
    ULPF_DATA_DIR: /var/lib/ulpf
  volumes:
    - ./source_packs:/app/source_packs:ro
    - ulpf-data:/var/lib/ulpf
  healthcheck:
    disable: true

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: ulpf-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy -X admin.hosts=127.0.0.1:9644"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    environment:
      ULPF_KAFKA_BROKERS: redpanda:9092
      ULPF_TOPIC_PARTITIONS: ${ULPF_TOPIC_PARTITIONS:-3}
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./deploy/redpanda/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  collector:
    <<: *ulpf-service
    container_name: ulpf-collector
    command: ["python", "-m", "src.collection.run"]
    environment:
      <<: *ulpf-environment
      ULPF_ARCHIVE_DIR: /var/lib/ulpf/raw-archive
      ULPF_UDP_PORT: "5514"
      ULPF_TCP_PORT: "5601"
    depends_on:
      topic-init:
        condition: service_completed_successfully
    ports:
      - "5514:5514/udp"
      - "5601:5601/tcp"

  parser-worker:
    <<: *ulpf-service
    command: ["python", "-m", "src.streaming.run", "parser"]
    depends_on:
      topic-init:
        condition: service_completed_successfully

  normalizer-worker:
    <<: *ulpf-service
    command: ["python", "-m", "src.streaming.run", "normalizer"]
    depends_on:
      topic-init:
        condition: service_completed_successfully

  retry-worker:
    <<: *ulpf-service
    command: ["python", "-m", "src.streaming.run", "retry"]
    depends_on:
      topic-init:
        condition: service_completed_successfully

  sink:
    <<: *ulpf-service
    command: ["python", "-m", "src.streaming.run", "sink"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  ulpf-engine:
    <<: *ulpf-service
    container_name: ulpf-engine
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    container_name: ulpf-clickhouse
    environment:
      CLICKHOUSE_DB: ulpf
      CLICKHOUSE_USER: ulpf
      CLICKHOUSE_PASSWORD: ${ULPF_CLICKHOUSE_PASSWORD:-ulpf-local}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}" --password
          "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  grafana:
    image: grafana/grafana:13.2.0
    container_name: ulpf-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ulpf-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource@4.20.0
      ULPF_CLICKHOUSE_PASSWORD: ${ULPF_CLICKHOUSE_PASSWORD:-ulpf-local}
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: ulpf-opensearch
    profiles: ["siem-search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  opensearch-init:
    image: curlimages/curl:8.14.1
    profiles: ["siem-search"]
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./schemas/opensearch-index-template-v1.json:/template.json:ro
    command:
      - -fsS
      - -X
      - PUT
      - http://opensearch:9200/_index_template/ulpf-events-v1
      - -H
      - Content-Type:application/json
      - --data-binary
      - "@/template.json"

volumes:
  redpanda-data:
  clickhouse-data:
  grafana-data:
  opensearch-data:
  ulpf-data:
