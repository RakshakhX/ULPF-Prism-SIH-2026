[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf-prism"
version = "0.1.0"
description = "Universal Log Pre-processing Framework prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.116",
  "jsonschema[format]==4.26.0",
  "pydantic>=2.6,<3.0",
  "PyYAML>=6.0,<7.0",
  "confluent-kafka==2.5.3",
  "psutil>=5.9,<7.0",
  "uvicorn[standard]>=0.29,<0.31",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest==9.1.1", "ruff==0.16.4"]
storage = ["clickhouse-connect>=0.8,<1.0"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires live external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
